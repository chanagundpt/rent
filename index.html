<!DOCTYPE html>
<!-- ไฟล์ต้นฉบับของโปรเจ็กต์ "ค่าเช่าห้อง" — ใช้ไฟล์ dist/Index.html (มีรูปโลโก้/QR ฝังแล้ว) วางใน Apps Script -->
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="เปี่ยมสุขคอร์ท">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f2ea">
<title>เปี่ยมสุขคอร์ท · ระบบจัดการหอพัก</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#f7f3ed;--card:#fff;--ink:#2a211b;--ink2:#54473d;--mut:#8f8276;--line:#ece4d9;--line2:#f4eee6;
  --pri:#7b3f22;--pri2:#9a5530;--pri-soft:#f6ebe1;--acc:#d07a36;--acc-soft:#fcefe2;
  --ok:#2f8a57;--ok-soft:#e6f4ec;--warn:#c26a12;--warn-soft:#fdf1e2;--bad:#c2372f;--bad-soft:#fcebe9;
  --elec:#d4880f;--elec-soft:#fdf3df;--water:#2a7fb8;--water-soft:#e6f2fa;--gray-soft:#f2ede6;
  --r:16px;--sh:0 1px 2px rgba(60,40,20,.05),0 4px 18px rgba(60,40,20,.05);--side:264px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Anuphan',system-ui,-apple-system,'Segoe UI',sans-serif;max-width:100%;overflow-x:hidden;overscroll-behavior:none}
@supports (overflow:clip){html,body{overflow-x:clip}}
body.lock{overflow:hidden}
img,svg,video,canvas{max-width:100%}
button{touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.muted{color:var(--mut)}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* เข้าสู่ระบบ */
#login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.lbox{background:var(--card);border-radius:24px;box-shadow:var(--sh);width:min(400px,100%);padding:28px 24px;text-align:center}
.lbox img{width:150px;height:150px;border-radius:24px;object-fit:cover;margin-bottom:6px}
.lbox h2{margin:4px 0 2px;font-size:20px}
/* โครงหน้า */
.side{position:fixed;left:0;top:0;bottom:0;width:var(--side);background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
.slogo{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.slogo img{width:48px;height:48px;border-radius:12px;object-fit:cover}
.slogo b{display:block;font-size:17px;line-height:1.2}
.slogo small{color:var(--mut);font-size:12px}
.snav{flex:1;overflow:auto;padding:14px 12px}
.snav .sec{font-size:12px;color:var(--mut);margin:16px 10px 6px;font-weight:600}
.nav{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:11px 14px;border-radius:12px;cursor:pointer;font-weight:500;font-size:15.5px;color:var(--ink2);margin-bottom:2px;text-align:left}
.nav:hover{background:var(--line2)}
.nav.on{background:var(--pri);color:#fff}
.nav .cnt{margin-left:auto;background:var(--bad);color:#fff;font-size:11.5px;font-weight:700;border-radius:999px;padding:0 7px;line-height:20px}
.nav.on .cnt{background:#fff;color:var(--pri)}
.sfoot{border-top:1px solid var(--line);padding:12px}
.user{display:flex;align-items:center;gap:10px;padding:8px 10px}
.ava{width:38px;height:38px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.wrap{margin-left:var(--side);min-height:100dvh}
.topbar{position:sticky;top:0;z-index:15;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 28px}
.tlogo{display:none}
.search{position:relative;flex:1;max-width:440px}
.search input{padding-left:40px;background:#fff}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}
.sres{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(60,40,20,.18);max-height:60vh;overflow:auto;z-index:30}
.sres button{display:flex;gap:10px;width:100%;border:0;background:none;padding:10px 14px;text-align:left;cursor:pointer;align-items:center}
.sres button:hover{background:var(--line2)}
.month{display:flex;align-items:center;gap:2px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;margin-left:auto}
.month > button{border:0;background:none;width:34px;height:36px;border-radius:9px;font-size:18px;cursor:pointer;color:var(--ink2)}
.month > button:hover{background:var(--line2)}
.month{position:relative}
.month > .mlabel{width:auto;min-width:150px;padding:0 10px;font-size:15px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.month .mlabel small{color:var(--mut);font-size:11px}
#pPanel{position:absolute;right:0;top:calc(100% + 8px);width:360px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 44px rgba(60,40,20,.18);padding:14px;z-index:40}
#pPanel .lbl{margin:0 0 6px}
#pPanel .fchips{flex-wrap:wrap;overflow:visible}
#pPanel .sep{border-top:1px solid var(--line2);margin:12px 0}
#pPanel .dates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
main{padding:26px 28px 110px}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{margin:0;font-size:28px;font-weight:700;line-height:1.2}
.ph p{margin:4px 0 0;color:var(--mut)}
.bottom{display:none}
/* การ์ด */
.card{background:var(--card);border-radius:var(--r);padding:18px 20px;margin-bottom:16px;box-shadow:var(--sh)}
.card h3{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:8px}
.card h3 .grow{flex:1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:12px;cursor:pointer;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:#f0c9c5}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{min-height:34px;padding:4px 12px;font-size:13.5px;border-radius:10px}
.link{border:0;background:none;color:var(--pri);cursor:pointer;padding:0 4px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
.kpi .l{color:var(--mut);font-size:13.5px;display:flex;align-items:center;gap:7px}
.kpi .l svg{width:18px;height:18px}
.kpi .v{font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px;line-height:1.25}
.kpi .s{font-size:12.5px;color:var(--mut)}
.kpi.ok .v,.kpi.ok .l svg{color:var(--ok)} .kpi.bad .v,.kpi.bad .l svg{color:var(--bad)} .kpi.acc .v,.kpi.acc .l svg{color:var(--acc)} .kpi.pri .v,.kpi.pri .l svg{color:var(--pri)}
.kpi.elec .v{color:var(--elec)} .kpi.water .v{color:var(--water)}
.bar{height:7px;background:var(--line2);border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:9px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.step{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.step.done .n{background:var(--ok);color:#fff}
.step b{font-size:15.5px}
.step .btn{margin-top:auto}
.list .it{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line2);cursor:pointer}
.list .it:last-child{border-bottom:0}
.list .it .t{font-weight:600}
.list .it .s{font-size:13px;color:var(--mut)}
.list .it .a{margin-left:auto;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.list .it .a small{display:block;font-weight:500;font-size:12.5px}
.seg{display:inline-flex;background:var(--line2);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;cursor:pointer;font-weight:500;color:var(--ink2);font-size:14px}
.seg button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(60,40,20,.14);font-weight:600}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap;color:var(--ink2)}
.fchips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.fchips button b{font-weight:700;margin-left:4px}
/* ผังห้อง: ชั้นเรียงไปทางขวา ห้องเรียงลงล่าง */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(160px,1fr);gap:14px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.scrollx,.fchips{overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.fcol{scroll-snap-align:start;min-width:0;background:rgba(255,255,255,.45);border-radius:16px;padding:8px}
.fhead{padding:4px 6px 10px;font-weight:700;font-size:14px;color:var(--ink2);display:flex;justify-content:space-between;align-items:center}
.fhead span{font-weight:500;color:var(--mut);font-size:12px}
.rc{display:block;width:100%;text-align:left;border:0;background:var(--card);border-radius:13px;padding:10px 12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--sh);border-left:4px solid transparent;position:relative}
.rc:active{transform:scale(.98)}
.rc .rn{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.rc .rn b{font-size:18px}
.rc .rn em{font-style:normal;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2)}
.rc .tn{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .us{font-size:12.5px;color:var(--ink2);margin-top:2px;font-variant-numeric:tabular-nums}
.rc .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.rc.full{border-left-color:var(--ok)} .rc.part{border-left-color:var(--elec)} .rc.none{border-left-color:#d8cdbf} .rc.err{border-left-color:var(--bad)}
.rc.vac{opacity:.6;box-shadow:none;background:transparent;border:1.5px dashed #d8cdbf}
.rc.saving:after{content:'';position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--acc);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
.tag{display:inline-flex;align-items:center;gap:3px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.75}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.elec{background:var(--elec-soft);color:var(--elec)} .tag.water{background:var(--water-soft);color:var(--water)}
.tag.blue{background:var(--pri-soft);color:var(--pri)} .tag.gray{background:var(--gray-soft);color:var(--mut)}
.msgs{margin:0;padding:0;list-style:none}
.msgs li{padding:9px 12px;border-radius:12px;margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msgs li.e{background:var(--bad-soft);color:var(--bad)} .msgs li.w{background:var(--warn-soft);color:var(--warn)}
.msgs li .grow{min-width:0}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.t th{font-size:12.5px;color:var(--mut);font-weight:600;text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px 8px;border-bottom:1px solid var(--line2);text-align:right;vertical-align:top}
table.t th.l,table.t td.l{text-align:left}
table.t td small{display:block;color:var(--mut);font-size:12px}
table.t tfoot td{font-weight:700;border-bottom:0}
.scrollx{overflow-x:auto}
.chart{display:flex;align-items:flex-end;gap:8px;height:170px;padding:8px 4px 0;border-bottom:1px solid var(--line)}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.chart i{display:block;width:100%;max-width:38px;border-radius:8px 8px 0 0;background:var(--acc)}
.chart i.paid{background:var(--ok)}
.chart small{font-size:11px;color:var(--mut);margin-top:4px;white-space:nowrap}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
.lbl{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
input,select,textarea{width:100%;max-width:100%;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;min-height:44px;font-size:16px;-webkit-appearance:none;appearance:none}
input[type=checkbox],input[type=radio]{-webkit-appearance:auto;appearance:auto}
select{background-image:linear-gradient(45deg,transparent 50%,#8f8276 50%),linear-gradient(135deg,#8f8276 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=date]{min-width:0;display:block}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px rgba(123,63,34,.12)}
.inrow{display:flex;gap:8px;align-items:stretch}
.inrow input{flex:1;min-width:0}
.scanbtn{flex:none;width:60px;border:0;border-radius:14px;background:#fff;color:var(--pri);cursor:pointer;display:flex;align-items:center;justify-content:center}
.scanbtn svg{width:26px;height:26px}
input.big{font-size:28px;font-weight:700;text-align:center;letter-spacing:1px;padding:8px;min-height:60px;font-variant-numeric:tabular-nums}
input.mid{font-size:18px;text-align:center}
input.big::placeholder{font-size:16px;font-weight:500;letter-spacing:0}
/* หน้าต่าง */
.modal{position:fixed;inset:0;background:rgba(40,25,15,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{overscroll-behavior:contain}
.modal .box{background:var(--card);border-radius:22px;width:min(560px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:20px 22px;box-shadow:0 20px 60px rgba(40,25,15,.25)}
.modal .box *{min-width:0}
.modal .box.wide{width:min(860px,100%)}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.mh h3{margin:0;font-size:19px}
.mroom{font-size:26px;font-weight:700;line-height:1.2}
.x{border:0;background:var(--line2);width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer;flex:none}
.mf{border-radius:16px;padding:12px 14px;margin:10px 0}
.mf.elec{background:var(--elec-soft)} .mf.water{background:var(--water-soft)}
.mf input{background:#fff;border-color:transparent}
.mfh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.mf.elec .mfh b{color:var(--elec)} .mf.water .mfh b{color:var(--water)}
.prev{margin-bottom:6px}
.info{min-height:24px;margin-top:6px;font-size:14px}
.info .e{color:var(--bad);font-weight:600} .info .w{color:var(--warn)}
.info label{display:flex;gap:8px;align-items:center;margin-top:4px;font-weight:500}
.info input[type=checkbox]{width:20px;height:20px;min-height:0}
.warn-t{color:var(--warn)}
.mbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.check{display:flex;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line2)}
.check input{width:20px;height:20px;min-height:0;flex:none}
.pdlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));column-gap:16px}
.radios{display:flex;gap:6px;flex-wrap:wrap}
.radios label{border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.radios input{width:auto;min-height:0}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;padding:4px 0 10px;border-bottom:1px solid var(--line2);margin-bottom:12px}
.kv div:nth-child(odd){color:var(--mut);font-size:14px}
.mcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mcard{border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.mcard.elec{background:var(--elec-soft);color:var(--elec)} .mcard.water{background:var(--water-soft);color:var(--water)}
.mcard svg{width:30px;height:30px}
.mcard b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2}
.mcard small{color:var(--ink2);font-size:12.5px}
/* สแกน */
#scan{position:fixed;inset:0;z-index:70;background:#120c08;color:#fff;display:flex;flex-direction:column}
.sc-top{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
.sc-top b{flex:1;font-size:17px}
.sc-top .x{background:rgba(255,255,255,.14);color:#fff}
.sc-view{position:relative;flex:1;min-height:200px;overflow:hidden;background:#000}
.sc-view video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:center;transition:transform .35s}
.sc-frame{position:absolute;left:8%;right:8%;top:36%;height:28%;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.45)}
.sc-frame span{position:absolute;top:-30px;left:0;right:0;text-align:center;font-size:13px}
.sc-hit{position:absolute;display:none;border:3px solid #ffb35c;border-radius:8px;box-shadow:0 0 0 2px rgba(0,0,0,.35);transition:all .2s;pointer-events:none}
.sc-zoom{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.6);padding:3px 10px;border-radius:999px;font-weight:700;font-size:13px}
.sc-nocam{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;flex:1;color:#e9ddd0;font-size:15px;overflow:auto}
.sc-panel{background:#2a1d14;padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0}
.sc-status{font-size:14px;color:#e9ddd0;min-height:22px}
.sc-res img{max-width:100%;max-height:120px;border-radius:10px;display:block;margin:8px auto;background:#fff}
.sc-val{font-size:38px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:1px}
.sc-alts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.sc-alts button{border:1px solid rgba(255,255,255,.3);background:none;color:#fff;border-radius:999px;padding:4px 12px;cursor:pointer}
.sc-alts button.on{background:#fff;color:#2a211b}
.sc-btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.sc-btns .btn{flex:1;background:rgba(255,255,255,.12);border:0;color:#fff}
.sc-btns .btn.primary{background:var(--acc)}
.sc-photo{position:relative;display:inline-block;max-width:100%;user-select:none;-webkit-user-select:none;line-height:0}
.sc-photo img{display:block;max-width:100%;max-height:calc(100dvh - 330px);min-height:120px;width:auto;height:auto;border-radius:12px;pointer-events:none}
.sc-sel{position:absolute;border:2px solid #ffb35c;background:rgba(255,179,92,.18);border-radius:6px;pointer-events:none}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,520px)}
#toast div{background:#2a211b;color:#fff;padding:10px 16px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-weight:500;text-align:center}
#toast div.bad{background:var(--bad)} #toast div.ok{background:var(--ok)}
.loading{padding:40px;text-align:center;color:var(--mut)}
.empty{text-align:center;padding:22px 10px;color:var(--mut)}
#printFrame{position:fixed;width:0;height:0;border:0;left:-9999px}
/* ปฏิทินจองห้องรายวัน */
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-h{text-align:center;font-size:12.5px;color:var(--mut);font-weight:600;padding:2px 0}
.cal-h.we{color:var(--bad)}
.cd{min-height:108px;min-width:0;border:1.5px solid #e3d7c7;background:#fff;border-radius:12px;padding:6px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:stretch;justify-content:flex-start;box-shadow:0 1px 2px rgba(60,40,20,.06);transition:border-color .15s,box-shadow .15s}
.cd:hover{border-color:var(--pri2);box-shadow:0 4px 12px rgba(60,40,20,.12)}
.cd .dn{display:flex;justify-content:space-between;align-items:center;gap:4px;font-weight:700;font-size:15px;color:var(--ink)}
.cd .dn small{font-weight:600;font-size:11px;white-space:nowrap;padding:0 7px;border-radius:999px;line-height:1.7;background:var(--ok-soft);color:var(--ok)}
.cd .dn small.full{background:var(--bad-soft);color:var(--bad)}
.cd.we{background:#fffaf4} .cd.we .dn{color:var(--bad)}
.cd.has{background:#fdf6ee;border-color:#e6cdb3}
.cd.past{background:#ede6dc;border-color:#ddd2c3;box-shadow:none} .cd.past .dn{color:#a89a8b}
.cd.past .dn small{background:none;color:#a89a8b;padding:0}
.cd.past .bk{opacity:.7}
.cd.today{border:2px solid var(--pri);padding:5px;background:#fff;box-shadow:0 0 0 3px rgba(123,63,34,.12)}
.cd.today .dn{color:var(--pri)}
.cd .tdy{font-size:10.5px;font-weight:700;color:#fff;background:var(--pri);border-radius:999px;padding:0 6px;margin-left:4px;line-height:1.7}
.cd.blank{visibility:hidden}
.bk{display:block;font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.6;border-left:3px solid transparent}
.bk.st{border-left-color:currentColor}
.bk.out{background:none!important;border:1px dashed var(--line);color:var(--mut)!important;font-weight:500}
.bk.c0{background:var(--ok-soft);color:var(--ok)} .bk.c1{background:var(--water-soft);color:var(--water)} .bk.c2{background:var(--elec-soft);color:var(--elec)}
.bk.c3{background:var(--pri-soft);color:var(--pri)} .bk.c4{background:var(--bad-soft);color:var(--bad)} .bk.c5{background:#efe9fb;color:#6a4fb3}
.legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.legend .bk{display:inline-block}
.bkgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.bksec{background:var(--line2);border-radius:14px;padding:4px 12px 12px;margin:12px 0 4px}
.bkdates{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:end}
.bkdates input{background:#fff}
.bkn{align-self:end;height:44px;display:flex;align-items:center;justify-content:center;padding:0 12px;border-radius:999px;background:var(--pri);color:#fff;font-weight:700;font-size:14px;white-space:nowrap}
.bkn.bad{background:var(--bad)}
.bkmoney{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:0 14px}
.bkcalc{background:var(--line2);border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px}
.bkwarn{color:var(--bad);font-weight:600;font-size:14px;min-height:0;margin-top:6px}
@media (max-width:1100px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .grid2{grid-template-columns:1fr} }
@media (max-width:860px){
  .side{display:none}
  .wrap{margin-left:0}
  .topbar{padding:10px 14px;gap:8px;flex-wrap:wrap}
  .tlogo{display:flex;align-items:center;gap:8px;font-weight:700}
  .tlogo img{width:36px;height:36px;border-radius:10px}
  .month{margin-left:auto}
  .month .mlabel{min-width:0;font-size:14px;padding:0 6px}
  #pPanel{position:fixed;left:12px;right:12px;top:auto;width:auto;margin-top:8px;max-height:75vh;overflow-y:auto}
  #pPanel .dates{grid-template-columns:minmax(0,1fr)}
  #pPanel input[type=date]{width:100%;min-width:0}
  .search{order:5;flex-basis:100%;max-width:none}
  main{padding:16px 14px 104px}
  .ph h1{font-size:23px}
  .steps{grid-template-columns:1fr;gap:8px}
  .step{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:10px;row-gap:0;padding:10px 12px}
  .step .n{grid-row:1/3}
  .step b{font-size:15px}
  .step .muted{grid-column:2;font-size:13px}
  .step .btn{grid-column:3;grid-row:1/3;margin:0}
  .board{grid-auto-columns:minmax(140px,1fr);gap:10px;margin:0 -14px;padding:2px 14px 10px}
  .bottom{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:30;background:#fff;border-radius:20px;padding:5px;box-shadow:0 8px 30px rgba(60,40,20,.18)}
  .bottom button{border:0;background:none;padding:6px 2px;border-radius:14px;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
  .bottom button.on{color:var(--pri);background:var(--pri-soft);font-weight:600}
  .modal{align-items:flex-end;padding:0}
  .modal .box,.modal .box.wide{width:100%;border-radius:24px 24px 0 0;max-height:94dvh;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
  table.t.cards thead{display:none}
  table.t.cards,table.t.cards tbody,table.t.cards tr,table.t.cards td{display:block;width:100%}
  table.t.cards tr{border-radius:14px;margin-bottom:8px;padding:8px 12px;background:var(--bg)}
  table.t.cards td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:10px;text-align:right}
  table.t.cards td:before{content:attr(data-l);color:var(--mut);font-size:13px;text-align:left}
  table.t.cards td.head{font-weight:700;font-size:16px}
  table.t.cards td.head:before{display:none}
}
@media (max-width:860px){
  .card.calc{padding:12px 8px}
  .cal-g{gap:3px}
  .cd{min-height:66px;padding:3px;border-radius:8px;gap:2px}
  .cd.today{padding:2px}
  .cd .dn{font-size:12.5px}
  .cd .dn small{display:none}
  .cd .tdy{display:none}
  .bkgrid{gap:0 10px}
  .bksec{padding:2px 10px 10px}
  .bkdates{gap:6px}
  .bkdates .lbl{font-size:12px}
  .bkdates input{padding:9px 6px;font-size:15px}
  .bkn{padding:0 8px;font-size:12.5px}
  .bkmoney{grid-template-columns:1fr 1fr;gap:0 10px}
  .bkpaid{grid-column:1/-1}
  .bk{font-size:10px;padding:0 3px;border-radius:4px;border-left-width:2px}
  .cd .bk .g{display:none}
}
@media (max-width:520px){ .kpi .v{font-size:22px} .mcards{grid-template-columns:1fr 1fr} .kv{grid-template-columns:96px 1fr} }
</style>
</head>

  var v = document.getElementById('scVideo'), view = document.getElementById('scView');
  var vw = v.videoWidth, vh = v.videoHeight, W = view.clientWidth, H = view.clientHeight;
  var s = Math.max(W / vw, H / vh) * (SC.dz || 1), ox = (W - vw * s) / 2, oy = (H - vh * s) / 2;
  var x = Math.max(0, -ox / s), y = Math.max(0, -oy / s), w = Math.min(vw - x, W / s), h = Math.min(vh - y, H / s);
  var k = Math.min(1, 1600 / w), c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(v, x, y, w, h, 0, 0, c.width, c.height);
  return c;
}
// กรอบส้มบนจอตรงช่องตัวเลขที่เจอ (ให้รู้ว่าระบบจับช่องถูกที่)
function scMark(bx, vc) {
  var view = document.getElementById('scView'), m = document.getElementById('scHit');
  if (!view) return;
  if (!m) { m = document.createElement('div'); m.id = 'scHit'; m.className = 'sc-hit'; view.appendChild(m); }
  if (!bx) { m.style.display = 'none'; return; }
  var W = view.clientWidth, H = view.clientHeight, ex = bx.w / 2.8; // รวมช่องทศนิยมทางขวา
  m.style.cssText = 'display:block;left:' + (bx.x / vc.width * W - 4) + 'px;top:' + (bx.y / vc.height * H - 4) + 'px;width:' + ((bx.w + ex) / vc.width * W + 8) + 'px;height:' + (bx.h / vc.height * H + 8) + 'px';
}
// กล้องสด: หาช่องตัวเลข → ซูมเข้าหาช่องอัตโนมัติ → อ่านได้ค่าเดิม 2 ครั้งติด = จับภาพและใส่ค่าให้เอง
function scLoop() {
  if (!SC || !SC.alive) return;
  var v = document.getElementById('scVideo');
  if (SC.busy || SC.result != null || !v || !v.videoWidth) { setTimeout(scLoop, 300); return; }
  if (SC.dz === undefined) setZoom(0);
  SC.busy = true;
  var vc = viewCanvas(), inv = SC.tries % 2 === 1;
  readCounter(vc, null, false).then(function (rc) {
    if (!SC || !SC.alive) return {};
    scMark(rc && rc.box, vc);
    if (rc && rc.box) {
      // กล้องที่ซูมได้จริง (ซูมออปติคอล): ซูมให้ช่องตัวเลขกว้างราว 1/3–3/4 ของจอ = ภาพชัดขึ้น
      // กล้องที่ไม่มีซูม: ไม่ซูม (ซูมดิจิทัลแค่ตัดภาพ ไม่ได้ชัดขึ้น และอาจตัดตัวเลขหลุดจอ)
      var frac = rc.box.w / vc.width;
      if (SC.hw && frac < 0.3 && SC.zi < ZOOMS.length - 1) setZoom(SC.zi + 1);
      else if (SC.hw && frac > 0.75 && SC.zi > 0) setZoom(SC.zi - 1);
      SC.seen = Date.now();
      if (rc.cands.length) { var rk = rankCands(rc.cands); return { cands: rk, best: SC.prevF ? rk[0] : rk.filter(plausible)[0], img: rc.canvas, counter: true }; }
      return { cands: [], best: null, found: true };
    }
    // ไม่เจอช่องตัวเลขแบบมิเตอร์ไฟ (เช่นมิเตอร์น้ำ): อ่านในกรอบแบบเดิม
    var c = frameCanvas();
    return ocrRead(prep(c, inv), '7').then(function (text) { var cs = parseCands(text); return { cands: cs, best: pickBest(cs), img: c }; });
  }).then(function (rr) {
    if (!SC || !SC.alive || !rr.cands) return;
    var cands = rr.cands, best = rr.best == null ? null : rr.best;
    if (best !== null) {
      var key = String(best);
      SC.hits[key] = (SC.hits[key] || 0) + 1;
      var again = SC.last === key; SC.last = key;
      if (again || SC.hits[key] >= 2) { showResult(best, cands, rr.img, rr.counter, true); return; }
      scStatus('อ่านได้ ' + fmt(best) + ' — ถือนิ่งๆ กำลังยืนยัน…');
    } else {
      SC.last = null;
      if (rr.found) { scStatus('เจอช่องตัวเลขแล้ว — ถือนิ่งๆ ให้ภาพชัด'); return; }
      SC.tries++;
      if (SC.hw && SC.tries % 3 === 0 && !(SC.seen && Date.now() - SC.seen < 3000)) { setZoom((SC.zi + 1) % ZOOMS.length); }
      scStatus('กำลังหาช่องตัวเลข… ซูม ' + ZOOMS[SC.zi] + '×' + (Date.now() - SC.t0 > 20000 ? ' · ถ้านานไป กด "ถ่ายรูปมิเตอร์"' : ''));
    }
  }).catch(function (e) { scStatus('อ่านไม่ได้: ' + errMsg(e)); })
    .then(function () { if (SC) SC.busy = false; setTimeout(scLoop, 150); });
}
// รูปถ่าย: ลองทั้งรูป แล้วซูมเข้ากลางภาพทีละขั้น + แถบแนวนอน จนกว่าจะเจอเลขที่เป็นไปได้
function scanPhoto(file) {
  if (!SC || !file) return;
  SC.result = null; SC.busy = true;
  if (SC.stream) { SC.stream.getTracks().forEach(function (t) { t.stop(); }); SC.stream = null; }
  document.getElementById('scView').classList.add('hidden');
  var nc = document.getElementById('scNoCam'); nc.classList.remove('hidden');
  document.getElementById('scRes').innerHTML = '';
  var url = URL.createObjectURL(file), img = new Image();
  img.onload = function () { scanImage(img, url); };
  img.onerror = function () { scStatus('เปิดรูปไม่ได้ ลองถ่ายใหม่'); };
  img.src = url;
}
function scanImage(img, url) {
  SC.photo = true; SC.result = null; SC.busy = true;
  if (SC.stream) { SC.stream.getTracks().forEach(function (t) { t.stop(); }); SC.stream = null; }
  document.getElementById('scView').classList.add('hidden');
  var nc = document.getElementById('scNoCam'); nc.classList.remove('hidden');
  nc.innerHTML = '<div class="sc-photo" id="scPhoto"><img src="' + url + '" alt="" draggable="false"><div class="sc-sel hidden" id="scSel"><\/div><\/div>';
  SC.img = img; bindSelect();
  var W = img.naturalWidth || img.width, H = img.naturalHeight || img.height, regs = [];
  [1, 1.5, 2, 3].forEach(function (z) { var w = W / z, h = H / z; regs.push({ z: z, x: (W - w) / 2, y: (H - h) / 2, w: w, h: h }); });
  [2, 3].forEach(function (z) { var h = H / (z * 1.6), w = Math.min(W, W / (z * 0.6)); [-0.5, 0.5].forEach(function (k) { regs.push({ z: z, x: (W - w) / 2, y: Math.max(0, Math.min(H - h, (H - h) / 2 + k * h)), w: w, h: h }); }); });
  var all = [], i = 0, t0 = Date.now();
  function finish() {
    if (!SC || SC.result != null) return;
    SC.busy = false;
    var best = pickBest(all);
    if (best !== null) return showResult(best, all, null);
    scStatus('อ่านตัวเลขไม่ได้ — ดูรูปด้านบนแล้วพิมพ์เอง หรือถ่ายใหม่ให้ใกล้และชัดขึ้น');
    document.getElementById('scRes').innerHTML = '<div class="sc-btns"><button class="btn primary" data-act="scClose">พิมพ์เอง<\/button><\/div>';
  }
  function next() {
    if (!SC || !SC.alive) return;
    if (i >= regs.length * 2 || Date.now() - t0 > 45000) return finish();
    var rg = regs[i >> 1], inv = i % 2 === 1; i++;
    scStatus('กำลังอ่านรูป… ซูม ' + rg.z + '× (' + i + '/' + regs.length * 2 + ')');
    var c = cropCanvas(img, rg.x, rg.y, rg.w, rg.h);
    return ocrRead(prep(c, inv), rg.w / rg.h > 2.2 ? '7' : '11').then(function (text) {
      if (!SC || !SC.alive) return;
      var cands = parseCands(text), best = pickBest(cands);
      cands.forEach(function (v) { all.push(v); });
      if (best !== null && scPrev() !== null) { showResult(best, cands, c); return; }
      if (best !== null) { SC.hits[best] = (SC.hits[best] || 0) + 1; if (SC.hits[best] >= 2) { showResult(best, cands, c); return; } }
      return next();
    });
  }
  getOcr().then(function () {
    scStatus('กำลังหาช่องตัวเลขในรูป…');
    return readCounter(img).then(function (rc) {
      if (!SC || !SC.alive) return;
      // เจอช่องตัวเลข: ใช้ผลจากช่องนี้เท่านั้น (ไม่ไปอ่านเลขอื่นบนป้ายมิเตอร์)
      if (rc && rc.cands.length) { rc.cands = rankCands(rc.cands); var ok = SC.prevF ? rc.cands : rc.cands.filter(plausible); showResult(ok[0] != null ? ok[0] : rc.val, rc.cands, rc.canvas, true); if (!ok.length) scStatus('⚠ ค่าที่อ่านได้ไม่สอดคล้องกับเลขเดือนก่อน — ตรวจกับมิเตอร์ หรือลากกรอบที่ตัวเลขในรูปเพื่ออ่านใหม่'); return; }
      if (!rc && srcSize(img).w / srcSize(img).h > 2) { var S1 = srcSize(img); readArea({ x: 0, y: 0, w: S1.w, h: S1.h }); return; }
      if (rc && rc.box) { SC.busy = false; scStatus('เจอช่องตัวเลขแต่ภาพไม่ชัด — ลากกรอบที่ตัวเลขในรูปด้านบน หรือถ่ายใหม่ให้ใกล้ขึ้น'); scDrawHint(); return; }
      return next();
    });
  }).catch(function (e) { scStatus('อ่านไม่ได้: ' + errMsg(e)); finish(); });
}
// ลากกรอบบนรูปถ่าย = อ่านเฉพาะในกรอบนั้น
function scDrawHint() {
  var r = document.getElementById('scRes');
  if (r && !document.getElementById('scVal')) r.innerHTML = '<div style="text-align:center;font-size:13px;color:#e9ddd0;margin-top:6px">👆 ลากนิ้วคลุมตัวเลขบนรูป (รวมหลักกรอบแดง) เพื่ออ่านเฉพาะตรงนั้น<\/div><div class="sc-btns"><button class="btn" data-act="scClose">พิมพ์เอง<\/button><\/div>';
}
function bindSelect() {
  var box = document.getElementById('scPhoto'), sel = document.getElementById('scSel'), st = null;
  if (!box) return;
  function pt(e) { var r = box.getBoundingClientRect(); return { x: Math.max(0, Math.min(r.width, e.clientX - r.left)), y: Math.max(0, Math.min(r.height, e.clientY - r.top)), r: r }; }
  box.style.touchAction = 'none';
  box.onpointerdown = function (e) { if (SC && SC.busy) return; st = pt(e); box.setPointerCapture(e.pointerId); sel.classList.remove('hidden'); sel.style.cssText = 'left:' + st.x + 'px;top:' + st.y + 'px;width:0;height:0'; };
  box.onpointermove = function (e) { if (!st) return; var p = pt(e); sel.style.left = Math.min(st.x, p.x) + 'px'; sel.style.top = Math.min(st.y, p.y) + 'px'; sel.style.width = Math.abs(p.x - st.x) + 'px'; sel.style.height = Math.abs(p.y - st.y) + 'px'; };
  box.onpointerup = function (e) {
    if (!st) return; var p = pt(e), a = st; st = null;
    var w = Math.abs(p.x - a.x), h = Math.abs(p.y - a.y);

    var S0 = srcSize(SC.img), k = S0.w / p.r.width;
    readArea({ x: Math.min(a.x, p.x) * k, y: Math.min(a.y, p.y) * k, w: w * k, h: h * k });
  };
}
// อ่านในกรอบที่ผู้ใช้เลือก: หาช่องตัวเลขในกรอบ ถ้าไม่เจอ ถือว่ากรอบนั้นคือช่องตัวเลข
function readArea(ar) {
  if (!SC || !SC.img) return;
  var img = SC.img; SC.result = null; SC.busy = true;
  if (window.SCAN_DEBUG) console.log('DBG area', JSON.stringify(ar));
  var pad = ar.h * 0.6, S0 = srcSize(img), big = { x: Math.max(0, ar.x - pad), y: Math.max(0, ar.y - pad) }; big.w = Math.min(S0.w - big.x, ar.w + pad * 2); big.h = Math.min(S0.h - big.y, ar.h + pad * 2);
  scStatus('กำลังอ่านในกรอบที่เลือก…'); document.getElementById('scRes').innerHTML = '';

    if (rc && rc.cands.length) return rc;
    var c = cropCanvas(img, ar.x, ar.y, ar.w, ar.h);
    return readDigits(c, true).then(function (inv) {
      return inv.length ? inv : readDigits(c, false);
    }).then(function (list) {
      var cands = [];
      list.forEach(function (s0) { if (s0.length >= 4) cands.push(Number(s0.slice(0, -1) + '.' + s0.slice(-1))); cands.push(Number(s0)); });
      return { cands: cands, canvas: c };
    });
  }).then(function (rc) {
    if (!SC) return;
    SC.busy = false;
    if (!rc.cands.length) { scStatus('ยังอ่านไม่ได้ — ลองลากกรอบให้พอดีตัวเลข หรือพิมพ์เอง'); scDrawHint(); return; }
    rc.cands = rankCands(rc.cands);
    var ok = SC.prevF ? rc.cands : rc.cands.filter(plausible);
    showResult(ok[0] != null ? ok[0] : rc.cands[0], rc.cands, rc.canvas, true);
  }).catch(function (e) { if (SC) { SC.busy = false; scStatus('อ่านไม่ได้: ' + errMsg(e)); } });
}
function showResult(best, cands, canvas, counter, auto) {

  if (SC.autoT) { clearInterval(SC.autoT); SC.autoT = null; }

  var prev = scPrev();
  document.getElementById('scRes').innerHTML = (canvas ? '<img src="' + canvas.toDataURL('image/jpeg', 0.8) + '" alt="">' : '') +
    '<div class="sc-val" id="scVal">' + fmt(best) + '<\/div>' +
    (prev !== null ? '<div style="text-align:center;font-size:13px;color:#e9ddd0">เดือนก่อน ' + fmt(prev) + ' → ใช้ ' + fmt(units(prev, best, best < prev)) + ' หน่วย' + (best < prev ? ' (มิเตอร์วนรอบ)' : '') + '<\/div>' : '') +
    (alts.length > 1 ? '<div class="sc-alts">' + alts.map(function (v) { return '<button data-act="scAlt" data-v="' + v + '" class="' + (v === best ? 'on' : '') + '">' + fmt(v) + '<\/button>'; }).join('') + '<\/div>' : '') +
    '<div class="sc-btns"><button class="btn" data-act="scAgain">↻ สแกนใหม่<\/button><button class="btn primary" data-act="scUse">✓ ใช้ค่านี้<\/button><\/div>';
  scStatus('ตรวจให้ตรงกับมิเตอร์ก่อนกด "ใช้ค่านี้"' + (SC.photo ? ' · ถ้าไม่ตรง ลากกรอบที่ตัวเลขบนรูปเพื่ออ่านใหม่' : ''));
  if (auto) {
    // กล้องสด: หยุดภาพ แล้วใส่ค่าให้เองใน 3 วินาที (กด "สแกนใหม่" หรือเลือกค่าอื่นเพื่อยกเลิก)

    SC.autoT = setInterval(function () {
      if (!SC || SC.result == null) return;
      n--;
      if (n <= 0) { clearInterval(SC.autoT); SC.autoT = null; useScan(); return; }
      scStatus('✓ อ่านได้แล้ว — ใส่ค่าให้อัตโนมัติใน ' + n + ' วินาที');
    }, 1000);
  }
}
function scCancelAuto() { if (SC && SC.autoT) { clearInterval(SC.autoT); SC.autoT = null; scStatus('ตรวจให้ตรงกับมิเตอร์ก่อนกด "ใช้ค่านี้"'); } }

  for (i = 0; i < 12; i++) if (t.indexOf(TH_M[i]) >= 0) mo = i + 1;
  if (!mo) Object.keys(TH_AB).forEach(function (k) { if (t.indexOf(k) >= 0 && (!mo || k.length > 3)) mo = TH_AB[k]; });

function parseBillBook(wb, fileName) {

    var g = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: null, blankrows: true });
    var at = function (r, c) { return g[r] && g[r][c] !== undefined ? g[r][c] : null; };
    g.forEach(function (row, r) {
      (row || []).forEach(function (v, c) {
        var m = /^ห้องเลขที่\s*(.+)$/.exec(String(v == null ? '' : v).trim());
        if (!m) return;

        for (var rr = r; rr <= r + 4 && !month; rr++) for (var cc = Math.max(0, c - 9); cc <= c + 1; cc++) { var mv = at(rr, cc); if (mv && /เดือน/.test(String(mv))) { month = thMonth(mv); if (month) break; } }
        for (rr = r + 1; rr <= r + 6 && lc < 0; rr++) for (cc = c; cc >= Math.max(0, c - 9); cc--) if (String(at(rr, cc) || '').trim() === 'รายการ') { lc = cc; hr = rr; break; }
        if (lc < 0) { warn.push(sn + ' ห้อง ' + room + ': หาหัวตารางไม่เจอ'); return; }
        var it = { month: month || fileMonth, room: room, rent: 0, fine: 0, others: [], total: null, sheet: sn };
        for (rr = hr + 1; rr <= hr + 20; rr++) {
          var lab = String(at(rr, lc) || '').trim(), lab0 = String(at(rr, lc - 1) || '').trim();
          if (/รวมทั้งสิ้น/.test(lab) || /รวมทั้งสิ้น/.test(lab0)) {
            for (cc = lc; cc <= lc + 7; cc++) { var tv = cellNum(at(rr, cc)); if (tv !== null) it.total = tv; }
            break;

          if (/ค่าห้อง/.test(lab)) it.rent = a[4] || 0;

          else if (/ค่าไฟ/.test(lab)) { it.elecPrev = a[0]; it.elecNow = a[1]; it.elecUnits = a[2]; it.elecAmt = a[4] || 0; }
          else if (/ค่าน้ำ/.test(lab)) { it.waterPrev = a[0]; it.waterNow = a[1]; it.waterUnits = a[2]; it.waterAmt = a[4] || 0; }
          else if (a[4]) it.others.push({ desc: lab, amount: a[4] });
        }
        if (!it.month) { warn.push(sn + ' ห้อง ' + room + ': หาเดือนไม่เจอ'); return; }
        var sum = r2(it.rent + it.fine + (it.elecAmt || 0) + (it.waterAmt || 0) + it.others.reduce(function (s2, o) { return s2 + o.amount; }, 0));

}

  else if (a === 'bkPaidAll') { var tv = val('bk-total'); document.getElementById('bk-paid').value = tv; updBook(); }
  else if (a === 'bkSave') busyBtn(t, saveBook);
  else if (a === 'bkDel') { var db = findBk(t.dataset.id); if (db) confirmBox('ลบการจอง', 'ลบการจองห้อง ' + esc(db.room) + ' ของ ' + esc(db.guest) + ' (' + dateTh(db.checkIn) + ' – ' + dateTh(db.checkOut) + ') ออกจากระบบ<br><span class="muted">ถ้าลูกค้ายกเลิก แนะนำให้เปลี่ยนสถานะเป็น "ยกเลิก" แทน เพื่อเก็บประวัติไว้<\/span>', 'ลบการจอง', function () {
    return api('deleteBooking', db.id, S.month).then(function (d) { S.bk = d; closeModal(); render(); toast('ลบการจองแล้ว'); });
  }, true); }
  else if (a === 'roomDlg') openRoom(room);
  else if (a === 'roomList') openRoomList();
  else if (a === 'saveRoomList') busyBtn(t, function () {
    var list = parseRoomList(val('rl-text'));
    if (!list.length) throw new Error('ใส่เลขห้องอย่างน้อย 1 ห้อง');
    return api('setRoomList', list, S.month).then(function (d) {
      setData(d); render(); closeModal();
      toast('บันทึก ' + d.rows.length + ' ห้องแล้ว' + (d.kept && d.kept.length ? ' (เก็บห้องที่มีข้อมูลแล้วไว้: ' + d.kept.join(', ') + ')' : ''), 'ok', 5000);
    });
  });
  else if (a === 'saveRoom') busyBtn(t, function () {
    var o = { room: val('rm-room'), floor: val('rm-floor'), tenant: val('rm-tenant'), phone: val('rm-phone'), rent: val('rm-rent'), other: val('rm-other'), otherName: val('rm-otherName'), status: val('rm-status'), daily: !!(document.getElementById('rm-daily') || {}).checked };
    return api('saveRoomForm', o, ROOM_RAW, S.month).then(function (d) { setData(d); S.bk = null; render(); closeModal(); toast('บันทึกห้อง ' + o.room + ' แล้ว', 'ok'); });
  });
  else if (a === 'delRoom') confirmBox('ลบห้อง ' + room, 'ลบได้เฉพาะห้องที่ยังไม่มีมิเตอร์/บิล', 'ลบห้อง', function () {
    return api('deleteRoom', room, S.month).then(function (d) { setData(d); render(); closeModal(); toast('ลบห้องแล้ว'); });
  }, true);
  else if (a === 'saveSettings') busyBtn(t, function () {
    var o = {}; S.data.settingsDef.forEach(function (d) { o[d[0]] = val('st-' + d[0]); });
    return api('saveSettings', o, S.month).then(function (d) { setData(d); render(); toast('บันทึกการตั้งค่าแล้ว', 'ok'); });
  });
  else if (a === 'doImport') busyBtn(t, function () {
    var items = (IMP || []).map(function (it) { var o = {}; Object.keys(it).forEach(function (k) { if (k !== 'check' && k !== 'sheet') o[k] = it[k]; }); return o; });
    return api('importHistory', items, { paid: document.getElementById('impPaid').checked }).then(function (r) {
      closeModal(); IMP = null; S.sum = null;
      toast('นำเข้าแล้ว ' + r.bills + ' บิล · มิเตอร์ ' + r.readings + ' รายการ' + (r.roomsAdded.length ? ' · เพิ่มห้อง ' + r.roomsAdded.join(', ') : '') + (r.skipped.length ? ' · ข้าม ' + r.skipped.length : ''), 'ok', 7000);
      return load();
    });
  });
  else if (a === 'changePw') busyBtn(t, function () {
    return api('changePassword', val('pw-old'), val('pw-new')).then(function () {
      TOKEN = ''; ls('rent.token', null); showLogin('เปลี่ยนรหัสผ่านแล้ว — เข้าสู่ระบบด้วยรหัสใหม่');
    });
  });
});
document.addEventListener('input', function (ev) {
  var id = ev.target.id || '';
  if (id === 'rl-text') { rlCount(); return; }
  if (/^bk-/.test(id)) { if (id === 'bk-total' && BKF) BKF.totalEdited = ev.target.value !== ''; updBook(); return; }
  if (!D) return;
  var m = /^(in|pv)-(elec|water)$/.exec(id);
  if (m) { if (m[1] === 'in') D[m[2]] = ev.target.value; else D[m[2] + 'Prev'] = ev.target.value; updInfo(m[2]); }
  else if (id === 'in-note') D.note = ev.target.value;
});
document.addEventListener('change', function (ev) {
  var id = ev.target.id || '';
  if (id === 'scFile' || id === 'scFile2') { scanPhoto(ev.target.files && ev.target.files[0]); return; }
  if (id === 'impFile') { importFiles(ev.target.files); ev.target.value = ''; return; }
  var m = /^roll-(elec|water)$/.exec(id);
  if (m && D) { D[m[1] + 'Roll'] = ev.target.checked; D[m[1] + 'RollSet'] = true; updInfo(m[1]); }
  if (id === 'd-from' || id === 'd-to') return;
  if (/^bk-/.test(id)) { updBook(); return; }
  if (id === 'p-month') { setMonth(ev.target.value); return; }
  if (id === 'pd-month') { loadPD(ev.target.value); return; }
  if (id === 'pd-layout') { PD.layout = ev.target.value; ls('rent.layout2', PD.layout); updPD(); return; }
  if (ev.target.classList && ev.target.classList.contains('pr-one')) updPD();
});
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape') { if (SC) stopScanner(); else if (MODAL_KIND !== 'meter') closeModal(); return; }
  if (ev.key !== 'Enter' || !D || SC) return;
  var order = [].slice.call(document.querySelectorAll('#modalBox input.big, #modalBox input.mid')).map(function (x) { return x.id; });
  var i = order.indexOf(ev.target.id);
  if (ev.target.id === 'in-note' || (i >= 0 && i === order.length - 1)) { ev.preventDefault(); saveMeter(); }
  else if (i >= 0) { ev.preventDefault(); var nx = document.getElementById(order[i + 1]); nx.focus(); nx.select(); }
});

if (TOKEN) startApp(); else showLogin('');
</script>
</body>
</html>
